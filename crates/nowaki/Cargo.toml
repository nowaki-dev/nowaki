[package]
name = "nowaki"
description = "A fast full-stack web framework with a Rust toolchain and islands architecture"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["web", "framework", "fullstack", "islands", "ssr"]
categories = ["web-programming", "development-tools", "command-line-utilities"]
readme = "../../README.md"

[[bin]]
name = "nowaki"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.1", features = ["derive"] }
nowaki-core = { path = "../nowaki-core" }
notify = "8.2.0"
reqwest = { version = "0.13.4", default-features = false, features = ["http2"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
