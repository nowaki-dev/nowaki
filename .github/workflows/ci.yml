name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (fmt, clippy, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace

  e2e:
    name: End-to-end (example app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install
      - run: cargo build -p nowaki
      - name: Start dev server and verify SSR, islands, API, and v0.3 routing
        run: |
          set -e
          ./target/debug/nowaki dev examples/hello &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/ >/dev/null && break
            sleep 1
          done
          B=http://127.0.0.1:3000
          status() { echo "$(curl -s -o /dev/null -w '%{http_code}' "$@")"; }

          # SSR + islands + transform
          curl -sf $B/ | grep -q "nowaki-island"
          curl -sf $B/ | grep -q 'client/router.js'
          curl -sf "$B/islands/Counter.tsx" | grep -q "jsx-runtime"

          # layouts (root + nested) and dynamic param
          curl -sf $B/ | grep -q 'href="/todos"'
          curl -sf $B/blog/hello | grep -q "blog section"
          curl -sf $B/blog/hello | grep -q "記事: hello"
          curl -sf $B/blog/hello | grep -q 'href="/about"'

          # middleware: header + auth redirect
          curl -s -D - -o /dev/null $B/ | grep -qi "x-nowaki-mw: 1"
          test "$(status $B/secret)" = "302"
          test "$(status "$B/secret?key=ok")" = "200"

          # 404 / 500 conventions
          test "$(status $B/nope)" = "404"
          curl -s $B/nope | grep -q "見つかりません"
          test "$(status "$B/boom?boom=1")" = "500"

          # API: legacy default, method dispatch, 405, streaming
          curl -sf $B/api/hello | grep -q '"hello":"nowaki"'
          curl -sf "$B/api/echo?q=hi" | grep -q '"q":"hi"'
          curl -sf -X POST -H 'content-type: application/json' -d '{"a":1}' $B/api/echo | grep -q '"received":{"a":1}'
          test "$(status -X DELETE $B/api/echo)" = "405"
          test "$(curl -s $B/api/stream | tr -d '\n')" = "chunk1chunk2"

          # action (form submission) via cookie PRG
          CJ=$(mktemp)
          test "$(status -c $CJ -X POST -d 'text=ci-todo' $B/todos)" = "302"
          curl -s -b $CJ $B/todos | grep -q "ci-todo"

          # v0.4 bundler features (rendered on the home page)
          curl -sf $B/ | grep -q 'class="badge_'          # CSS Modules scoped class
          curl -sf $B/ | grep -q 'src="/logo.svg"'        # asset import URL
          curl -sf $B/ | grep -q '<code>a→b</code>'       # cyclic dependency resolves
          curl -sf "$B/islands/Counter.tsx" | grep -q 'sourceMappingURL=data'  # dev source map

          # v0.5 plugin transform hook (nowaki.config.mjs rewrites a token before oxc)
          curl -sf $B/plugin | grep -q 'transformed-by-plugin'
          ! curl -sf $B/plugin | grep -q '__PLUGIN_MARK__'

          kill $SERVER_PID

      - name: Production build + scope hoisting + preload + serve
        run: |
          set -e
          ./target/debug/nowaki build examples/hello
          test -f examples/hello/dist/client/manifest.json
          grep -q '"preload"' examples/hello/dist/client/manifest.json
          # scope hoisting: the cyclic lib modules are concatenated into the Cycle
          # island chunk, not emitted as separate files, and the chunk has no
          # internal ./cycle- import (the cycle is resolved within one scope).
          ! ls examples/hello/dist/client/cycle-a.*.js >/dev/null 2>&1
          CY=$(ls examples/hello/dist/client/Cycle.*.js | head -1)
          ! grep -q './cycle-' "$CY"
          ./target/debug/nowaki start examples/hello --port 3300 &
          START_PID=$!
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:3300/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:3300/ | grep -q "modulepreload"
          curl -sf http://127.0.0.1:3300/ | grep -q '<code>a→b</code>'
          kill $START_PID

      - name: Deploy adapters — self-contained node entry + static + streaming SSR
        run: |
          set -e
          # node adapter: build emits a self-contained server entry runnable WITHOUT the nowaki binary
          ./target/debug/nowaki build examples/hello --adapter node
          test -f examples/hello/dist/server/index.mjs
          test -f examples/hello/dist/server/package.json
          PORT=3310 node examples/hello/dist/server/index.mjs &
          NODE_PID=$!
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:3310/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:3310/ | grep -q "nowaki-island"   # SSR + island marker
          curl -sf http://127.0.0.1:3310/api/hello | grep -q '"hello":"nowaki"'
          # streaming SSR route (export const streaming = true) renders a complete document
          curl -sf http://127.0.0.1:3310/stream | grep -q "Streaming SSR"
          curl -sf http://127.0.0.1:3310/stream | grep -q "nowaki-island"
          kill $NODE_PID
          # static adapter: prerender to dist/static
          ./target/debug/nowaki build examples/hello --adapter static
          test -f examples/hello/dist/static/index.html
          test -f examples/hello/dist/static/about/index.html
          # cloudflare (edge) adapter: generates a bundled fetch-handler worker + wrangler config
          ./target/debug/nowaki build examples/hello --adapter cloudflare
          test -f examples/hello/dist/worker/index.js
          test -f examples/hello/dist/worker/wrangler.jsonc
          grep -q "createFetchHandler" examples/hello/dist/worker/index.js
          grep -q '"binding": "ASSETS"' examples/hello/dist/worker/wrangler.jsonc

  npm-cli:
    name: npm CLI wrapper (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble host package + resolve through JS shim
        run: |
          node scripts/build-npm.mjs linux-x64-gnu
          # 実 install 相当のレイアウト（実ファイル）を作り、wrapper シム経由で --version
          ROOT=$(mktemp -d)
          mkdir -p "$ROOT/node_modules/nowaki" "$ROOT/node_modules/@nowaki-dev"
          cp packages/nowaki-cli/package.json "$ROOT/node_modules/nowaki/"
          cp -R packages/nowaki-cli/bin packages/nowaki-cli/lib "$ROOT/node_modules/nowaki/"
          cp -R packages/nowaki-cli/npm/linux-x64-gnu "$ROOT/node_modules/@nowaki-dev/cli-linux-x64-gnu"
          VER=$(node -p "require('./packages/nowaki-cli/package.json').version")
          OUT=$(node "$ROOT/node_modules/nowaki/bin/nowaki.js" --version)
          echo "shim output: '$OUT' (expected 'nowaki $VER')"
          test "$OUT" = "nowaki $VER"
