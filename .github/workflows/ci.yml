name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (fmt, clippy, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      # unit + transform tests run here; the CLI integration test skips without
      # the example app's node_modules (it runs fully in the e2e job's build).
      - run: cargo test --workspace

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install
      # JS の本番依存の既知脆弱性を継続監査（推移的な警告ではジョブを落とさない）。
      - run: pnpm audit --prod || true

  e2e:
    name: End-to-end (example app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install
      - run: cargo build -p nowaki
      - name: Router snapshot/unit test (scanRoutes + matchRoute)
        run: node scripts/router-test.mjs
      - name: Client router-cache unit test (matchBoundary + Router Cache TTL/LRU)
        run: node scripts/router-cache-test.mjs
      - name: Start dev server and verify SSR, islands, API, and v0.3 routing
        run: |
          set -e
          ./target/debug/nowaki dev examples/hello &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/ >/dev/null && break
            sleep 1
          done
          B=http://127.0.0.1:3000
          status() { echo "$(curl -s -o /dev/null -w '%{http_code}' "$@")"; }

          # SSR + islands + transform
          curl -sf $B/ | grep -q "nowaki-island"
          curl -sf $B/ | grep -q 'client/router.js'
          curl -sf "$B/islands/Counter.tsx" | grep -q "jsx-runtime"

          # layouts (root + nested) and dynamic param
          curl -sf $B/ | grep -q 'href="/todos"'
          curl -sf $B/blog/hello | grep -q "blog section"
          curl -sf $B/blog/hello | grep -q "記事: hello"
          curl -sf $B/blog/hello | grep -q 'href="/about"'

          # catch-all routes ([...path]): /files/a/b/c binds the rest as an array,
          # /files (no trailing segment) does not match.
          curl -sf $B/files/a/b/c | grep -q 'a / b / c (3)'
          test "$(status $B/files)" = "404"
          # async/dynamic metadata: export function meta() computes <title> from params
          curl -sf $B/files/a/b/c | grep -q '<title>files/a/b/c'

          # middleware: header + auth redirect
          curl -s -D - -o /dev/null $B/ | grep -qi "x-nowaki-mw: 1"
          test "$(status $B/secret)" = "302"
          test "$(status "$B/secret?key=ok")" = "200"

          # 404 / 500 conventions
          test "$(status $B/nope)" = "404"
          curl -s $B/nope | grep -q "見つかりません"
          test "$(status "$B/boom?boom=1")" = "500"

          # API: legacy default, method dispatch, 405, streaming
          curl -sf $B/api/hello | grep -q '"hello":"nowaki"'
          curl -sf "$B/api/echo?q=hi" | grep -q '"q":"hi"'
          curl -sf -X POST -H 'content-type: application/json' -d '{"a":1}' $B/api/echo | grep -q '"received":{"a":1}'
          test "$(status -X DELETE $B/api/echo)" = "405"
          test "$(curl -s $B/api/stream | tr -d '\n')" = "chunk1chunk2"

          # action (form submission) via cookie PRG
          CJ=$(mktemp)
          test "$(status -c $CJ -X POST -d 'text=ci-todo' $B/todos)" = "302"
          curl -s -b $CJ $B/todos | grep -q "ci-todo"

          # v0.4 bundler features (rendered on the home page)
          curl -sf $B/ | grep -q 'class="badge_'          # CSS Modules scoped class
          curl -sf $B/ | grep -q 'src="/logo.svg"'        # asset import URL
          curl -sf $B/ | grep -q '<code>a→b</code>'       # cyclic dependency resolves
          curl -sf "$B/islands/Counter.tsx" | grep -q 'sourceMappingURL=data'  # dev source map

          # v0.5 plugin transform hook (nowaki.config.mjs rewrites a token before oxc)
          curl -sf $B/plugin | grep -q 'transformed-by-plugin'
          ! curl -sf $B/plugin | grep -q '__PLUGIN_MARK__'

          # v0.5 TSRX: a .tsrx island compiled to Preact via @tsrx/preact, SSR + island wrap
          curl -sf $B/tsrx | grep -q 'nowaki-island name="TsrxCounter"'
          curl -sf $B/tsrx | grep -q 'tsrx: 5'

          # v0.6 Jetstream: server-reactive island SSRs as <nowaki-live> with initial state,
          # loads live.js, and coexists with a client island on the same page
          curl -sf $B/live | grep -q 'nowaki-live name="LiveCounter"'
          curl -sf $B/live | grep -q 'live: 0'
          curl -sf $B/live | grep -q 'client/live.js'
          curl -sf $B/live | grep -q 'nowaki-island name="Counter"'

          # v0.8 server functions: "use server" RPC. The browser gets a fetch proxy
          # (no impl/secret); POST /__nowaki/fn runs the real function server-side,
          # and getContext() reads the request cookie. Unknown id is rejected.
          curl -sf "$B/actions/todos.ts" | grep -q '__nowakiCall'
          ! curl -sf "$B/actions/todos.ts" | grep -q 'nowaki-server-only-secret'
          curl -sf "$B/__nowaki/server-functions" | grep -q '"export":"listTodos"'
          curl -sf -XPOST -H 'content-type: application/json' -d '{"id":"6c90d7dc921a9a3f","args":[]}' $B/__nowaki/fn | grep -q 'learn nowaki'
          curl -sf -XPOST -H 'content-type: application/json' -H 'cookie: user=alice' -d '{"id":"781de5a7f5ba2469","args":[]}' $B/__nowaki/fn | grep -q 'alice'
          test "$(status -XPOST -H 'content-type: application/json' -d '{"id":"deadbeefdeadbeef","args":[]}' $B/__nowaki/fn)" = "404"
          curl -sf $B/server-fn | grep -q 'nowaki-island name="ServerTodos"'

          # server fn as a <form action>: the islands runtime intercepts the submit and
          # posts the form to the fn. Here we exercise the server side (addTodoForm) and
          # confirm the runtime ships the form interceptor.
          curl -sf -XPOST -H 'content-type: application/json' -d '{"id":"5591e6fc8d31a200","args":[{"text":"ci-form-action"}]}' $B/__nowaki/fn >/dev/null
          curl -sf -XPOST -H 'content-type: application/json' -d '{"id":"6c90d7dc921a9a3f","args":[]}' $B/__nowaki/fn | grep -q 'ci-form-action'
          curl -sf "$B/server-fn" | grep -q 'fa-form'

          # v0.9 virtual modules: a plugin resolveId/load provides virtual:build-info,
          # imported by an island. SSR renders it (inlined as a data: module) and the
          # island's browser JS loads the generated source from a /__nowaki_virtual__/ URL.
          curl -sf $B/virtual | grep -q 'VIRTUAL_OK · nowaki-plugin'
          curl -sf $B/virtual | grep -q 'nowaki-island name="VirtualBadge"'

          # loading/error boundaries: the client router fetches /__nowaki/boundaries
          # for the SSR'd loading + error UIs (nwk-pulse = loading skeleton,
          # data-nowaki-reset = error retry). They are conventions, not routes, so
          # /loading and /error are 404. (DOM behavior is covered by router-browser-test.)
          curl -sf $B/__nowaki/boundaries | grep -q 'nwk-pulse'
          curl -sf $B/__nowaki/boundaries | grep -q 'data-nowaki-reset'
          test "$(status $B/loading)" = "404"
          test "$(status $B/error)" = "404"
          curl -sf "$B/slow?ms=0" | grep -q 'data-testid="slow"'

          kill $SERVER_PID

      - name: Production build + scope hoisting + preload + serve
        run: |
          set -e
          ./target/debug/nowaki build examples/hello
          test -f examples/hello/dist/client/manifest.json
          grep -q '"preload"' examples/hello/dist/client/manifest.json
          # scope hoisting: the cyclic lib modules are concatenated into the Cycle
          # island chunk, not emitted as separate files, and the chunk has no
          # internal ./cycle- import (the cycle is resolved within one scope).
          ! ls examples/hello/dist/client/cycle-a.*.js >/dev/null 2>&1
          CY=$(ls examples/hello/dist/client/Cycle.*.js | head -1)
          ! grep -q './cycle-' "$CY"
          # v0.6 Jetstream build: the live island ships NO client component JS (only live.js),
          # is listed in the manifest, and is still built as a server module for rendering.
          grep -q '"liveIslands": \["LiveCounter"\]' examples/hello/dist/client/manifest.json
          ! ls examples/hello/dist/client/LiveCounter.*.js >/dev/null 2>&1
          ls examples/hello/dist/client/live.*.js >/dev/null 2>&1
          test -f examples/hello/dist/server/islands/LiveCounter.js
          # nowaki start (Rust front) serves the live island, assembled with live.js
          ./target/debug/nowaki start examples/hello --port 3300 &
          START_PID=$!
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:3300/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:3300/ | grep -q "modulepreload"
          curl -sf http://127.0.0.1:3300/ | grep -q '<code>a→b</code>'
          curl -sf http://127.0.0.1:3300/live | grep -q 'nowaki-live name="LiveCounter"'
          curl -sf http://127.0.0.1:3300/live | grep -q 'live\.'  # live.js script
          # v0.8 server functions in production: allowlist written, no impl leaked to
          # the client, and the Rust front proxies /__nowaki/fn to the renderer.
          test -f examples/hello/dist/server/functions.json
          grep -q '"export": "addTodo"' examples/hello/dist/server/functions.json
          ! grep -rl 'nowaki-server-only-secret' examples/hello/dist/client >/dev/null 2>&1
          curl -sf -XPOST -H 'content-type: application/json' -d '{"id":"6c90d7dc921a9a3f","args":[]}' http://127.0.0.1:3300/__nowaki/fn | grep -q 'learn nowaki'
          # v0.9 virtual modules: SSR inlines the plugin-generated module (data:)
          curl -sf http://127.0.0.1:3300/virtual | grep -q 'VIRTUAL_OK · nowaki-plugin'
          # ISR (export const revalidate=2): the Rust front caches assembled HTML and
          # regenerates it in the background once stale. Cold hit MISSes & populates;
          # the next is a HIT with the same render number; after the 2s window a STALE
          # response is served (old HTML) while a fresh render runs in the background;
          # the following hit is fresh (render number incremented).
          ISR=http://127.0.0.1:3300/isr
          chit() { curl -s -D - -o /tmp/isr.html "$ISR" | grep -i '^x-nowaki-cache:' | tr -d '\r' | awk '{print $2}'; }
          rnum() { grep -o 'isr-renders">[0-9]*' /tmp/isr.html | grep -o '[0-9]*'; }
          test "$(chit)" = "MISS"; R1=$(rnum)
          curl -s -D - -o /dev/null "$ISR" | grep -qi 'cache-control: public, s-maxage=2, stale-while-revalidate'
          test "$(chit)" = "HIT"; test "$(rnum)" = "$R1"
          sleep 3
          test "$(chit)" = "STALE"; test "$(rnum)" = "$R1"   # stale HTML served immediately
          sleep 1                                            # let background revalidation finish
          test "$(chit)" = "HIT"; test "$(rnum)" -gt "$R1"   # regenerated
          # a cookie-setting response is per-user and must never be ISR-cached
          test -z "$(curl -s -D - -o /dev/null "$ISR" | grep -i '^set-cookie:')"
          # loading/error boundaries are served through the Rust front too
          curl -sf http://127.0.0.1:3300/__nowaki/boundaries | grep -q 'data-nowaki-reset'
          # v0.9 Jetstream presence + connection scaling: WS join->presence,
          # event->patch round-trip, presence rises/falls across two connections.
          node scripts/livetest.mjs http://127.0.0.1:3300
          kill $START_PID

      - name: Deploy adapters — self-contained node entry + static + streaming SSR
        run: |
          set -e
          # node adapter: build emits a self-contained server entry runnable WITHOUT the nowaki binary
          ./target/debug/nowaki build examples/hello --adapter node
          test -f examples/hello/dist/server/index.mjs
          test -f examples/hello/dist/server/package.json
          PORT=3310 node examples/hello/dist/server/index.mjs &
          NODE_PID=$!
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:3310/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:3310/ | grep -q "nowaki-island"   # SSR + island marker
          curl -sf http://127.0.0.1:3310/api/hello | grep -q '"hello":"nowaki"'
          # streaming SSR route (export const streaming = true) renders a complete document
          curl -sf http://127.0.0.1:3310/stream | grep -q "Streaming SSR"
          curl -sf http://127.0.0.1:3310/stream | grep -q "nowaki-island"
          # ISR signal is universal: the node adapter emits the same Cache-Control,
          # so the page gets stale-while-revalidate on any CDN/edge without the Rust front.
          curl -s -D - -o /dev/null http://127.0.0.1:3310/isr | grep -qi 'cache-control: public, s-maxage=2, stale-while-revalidate'
          kill $NODE_PID
          # static adapter: prerender to dist/static
          ./target/debug/nowaki build examples/hello --adapter static
          test -f examples/hello/dist/static/index.html
          test -f examples/hello/dist/static/about/index.html
          # cloudflare (edge) adapter: generates a bundled fetch-handler worker + wrangler config
          ./target/debug/nowaki build examples/hello --adapter cloudflare
          test -f examples/hello/dist/worker/index.js
          test -f examples/hello/dist/worker/wrangler.jsonc
          grep -q "createFetchHandler" examples/hello/dist/worker/index.js
          grep -q '"binding": "ASSETS"' examples/hello/dist/worker/wrangler.jsonc

  bench-regression:
    name: Client JS size (regression gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install
      - run: cargo build -p nowaki
      # 送信 JS は決定的。benchmarks/baseline.json から +12% を超えたら fail。
      # head-to-head（Next/Astro 比較）は手元/別ジョブで実行（重い依存のため CI 既定では走らせない）。
      - run: node benchmarks/check-regression.mjs

  npm-cli:
    name: npm CLI wrapper (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble host package + resolve through JS shim
        run: |
          node scripts/build-npm.mjs linux-x64-gnu
          # 実 install 相当のレイアウト（実ファイル）を作り、wrapper シム経由で --version
          ROOT=$(mktemp -d)
          mkdir -p "$ROOT/node_modules/nowaki" "$ROOT/node_modules/@nowaki-dev"
          cp packages/nowaki-cli/package.json "$ROOT/node_modules/nowaki/"
          cp -R packages/nowaki-cli/bin packages/nowaki-cli/lib "$ROOT/node_modules/nowaki/"
          cp -R packages/nowaki-cli/npm/linux-x64-gnu "$ROOT/node_modules/@nowaki-dev/cli-linux-x64-gnu"
          VER=$(node -p "require('./packages/nowaki-cli/package.json').version")
          OUT=$(node "$ROOT/node_modules/nowaki/bin/nowaki.js" --version)
          echo "shim output: '$OUT' (expected 'nowaki $VER')"
          test "$OUT" = "nowaki $VER"
