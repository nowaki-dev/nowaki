packages:
  - "packages/*"
  # nowaki CLI ラッパーはワークスペースに含めない: プリビルドバイナリを optionalDependencies
  # (@nowaki-dev/cli-*) で配るため、ローカルの pnpm install で不要な解決/DLを避ける。
  # 公開は scripts/build-npm.mjs + リリース CI が npm publish で直接行う。
  - "!packages/nowaki-cli"
  - "examples/*"
  - "site"
# ワークスペース内の semver 依存（create-nowaki-app → create-nowaki 等）をローカルリンクする。
# pnpm 10+ の既定 false だと registry から取得してしまい、公開直後の版が
# minimumReleaseAge ポリシーに引っかかる。公開時の package.json は素の semver のまま。
linkWorkspacePackages: true
minimumReleaseAgeExclude:
  - '@tsrx/core@0.1.30'
  - '@tsrx/preact@0.1.30'
